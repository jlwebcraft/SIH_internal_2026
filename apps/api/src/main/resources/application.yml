spring:
  application:
    name: supply-chain-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:supply_chain_db}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: filesystem:../../infra/database/migrations

server:
  port: 8080

ml:
  service:
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${ML_SERVICE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${ML_SERVICE_READ_TIMEOUT_MS:5000}
